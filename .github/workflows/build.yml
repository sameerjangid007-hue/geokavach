name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fetch Pub Packages
        run: flutter pub get

      - name: Generate Android Skeleton
        run: flutter create . --platforms=android

      - name: Grant Android Internet Permission
        run: |
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f:
              content = f.read()
          perm = '<uses-permission android:name=\"android.permission.INTERNET\"/>\n'
          if 'android.permission.INTERNET' not in content:
              content = content.replace('<application', perm + '    <application')
              with open(p, 'w') as f:
                  f.write(content)
          "

      - name: Build Standalone Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: geokavach-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
